<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="B1 Quiz — Luyện thi trắc nghiệm PET Cambridge. Đầy đủ 4 bài test Reading & Listening với đáp án chi tiết.">
  <title>B1 Quiz — Cambridge PET Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- SVG defs always available -->
  <svg class="svg-defs" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#58a6ff"/>
        <stop offset="100%" stop-color="#a371f7"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo">PET</div>
          <div class="brand-text">
            <strong>B1 Quiz</strong>
            <span>Cambridge Practice</span>
          </div>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Đóng sidebar">✕</button>
      </div>

      <div class="sidebar-score-card" id="sidebarScoreCard">
        <div class="score-title">Tiến độ tổng thể</div>
        <div class="score-ring-wrap">
          <svg class="score-ring" viewBox="0 0 80 80">
            <circle class="ring-bg" cx="40" cy="40" r="32"/>
            <circle class="ring-fill" cx="40" cy="40" r="32" id="ringFill"/>
          </svg>
          <div class="ring-text" id="ringPercent">0%</div>
        </div>
        <div class="score-detail" id="sidebarScoreDetail">0 / 0 câu đúng</div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Generated by JS -->
      </nav>
    </aside>

    <!-- Main workspace -->
    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <div class="topbar-breadcrumb" id="topbarBreadcrumb">
          <span>B1 Quiz</span>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost" id="loginBtn" title="Đăng nhập">👤 Đăng nhập</button>
          <div class="user-profile" id="userProfile" style="display:none;">
            <span class="user-name" id="userNameDisplay">User</span>
            <button class="icon-btn" id="logoutBtn" title="Đăng xuất" aria-label="Đăng xuất">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </button>
          </div>
          <button class="icon-btn" id="resetBtn" title="Đặt lại tiến độ" aria-label="Đặt lại">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <!-- Overlay backdrop -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Reset confirm dialog -->
  <div class="dialog-overlay" id="resetDialog" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true">
      <h3>Đặt lại tất cả tiến độ?</h3>
      <p>Toàn bộ lịch sử trả lời sẽ bị xoá. Hành động này không thể hoàn tác.</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" id="resetCancel">Huỷ</button>
        <button class="btn btn-danger" id="resetConfirm">Xoá & Đặt lại</button>
      </div>
    </div>
  </div>

  <!-- Login dialog -->
  <div class="dialog-overlay" id="loginDialog" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true">
      <h3>Đăng nhập</h3>
      <p>Nhập tên của bạn để lưu tiến độ và sử dụng tính năng bình luận.</p>
      <input type="text" id="loginNameInput" class="form-input" placeholder="Tên hiển thị..." autocomplete="off">
      <div class="dialog-actions" style="margin-top: 20px;">
        <button class="btn btn-ghost" id="loginCancel">Huỷ</button>
        <button class="btn btn-primary" id="loginConfirm">Đăng nhập</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
